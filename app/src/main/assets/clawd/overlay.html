<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<!--
  Clawd 悬浮窗渲染页（2026-10-09）

  ## 为什么用 WebView 而不是原生 View
  素材 SVG 自带 CSS @keyframes 动画（打字动作有 body-bounce / arm-type /
  code-line 等多组关键帧）。用 WebView 加载 SVG，动画**白拿**；
  换成 AndroidSVG 之类的解析库只能得到静态图，动画得用 Kotlin 重写一遍
  （22 个文件、上百组关键帧）。

  ## 通信协议
  Kotlin 侧通过 evaluateJavascript 调用：
    setState('clawd-working-typing.svg')  切状态（同值不重载，避免动画重启）
    setBubble('文本')                      设气泡（空串 = 隐藏）

  ## 为什么状态用「同值不重载」判断
  <img src> 每次赋值都会重新加载 SVG → 动画从头播。
  如果每帧都重设（如 SPEAKING 状态持续期间），螃蟹的呼吸动画会不停重启，
  看起来像抽搐。所以同值直接 return。
-->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, "Noto Sans CJK SC", "PingFang SC", sans-serif;
  }
  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
  }
  #bubble {
    max-width: 94%;
    margin-bottom: 2px;
    background: rgba(22, 22, 30, .9);
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    /* ══════════════════════════════════════════════════════════
       【2026-10-10 修「DeepSeek 显示成 Deep」】
       原来直接对文本用 `-webkit-line-clamp: 3`（显示**前** 3 行）——
       文本超长时最新内容全被裁掉，且词跨在第 3/4 行边界时
       会被从中间切断（「DeepSeek」→「Deep」）。
       现在：JS 侧截取**尾部**（见 setBubble，保留最后 ~90 字符、
       词边界起切），CSS 这里用 flex 底部对齐作保险 —— 即使
       内容仍超 3 行，裁切也发生在**顶部**（保住最新内容）。
       ══════════════════════════════════════════════════════════ */
    max-height: 4.35em;              /* 3 行 × 1.45 行高，保险用 */
    overflow: hidden;
    display: flex;
    align-items: flex-end;           /* 内层从底部对齐 → 溢出裁顶部 */
  }
  /* 内层：文本本体（padding 跟着它，底部对齐后 padding-top 被裁无妨） */
  #bubbleText {
    display: block;
    width: 100%;
    padding: 7px 10px;
    color: #f2f2f7;
    font-size: 11px; line-height: 1.45;
    word-break: break-word;
    white-space: pre-wrap;
  }
  #bubble:not(.show) { display: none; }
  #pet {
    width: 100%; height: auto;
    display: block;
    pointer-events: none;
    transform-origin: center bottom;
    /* ══════════════════════════════════════════════════════════
       为什么需要 scale(1.75)
       ══════════════════════════════════════════════════════════
       素材的 viewBox 是 `-15 -25 45 45`（45×45），但螃蟹本体只占
       约 x: 0~14, y: 5~16 —— 留白率 85%，原样显示螃蟹只有指甲盖大
       （实测：132dp 窗口里螃蟹不到 40dp）。

       scale 1.75 是实测值：螃蟹填到窗口约一半宽度，同时留出足够
       空间给「思考气泡 / 打字屏幕 / 表情符号」这些向外扩展的动画元素
       （再大会被裁掉头顶的思考气泡）。
       ══════════════════════════════════════════════════════════ */
    transform: scale(1.75);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"><span id="bubbleText"></span></div>
  <img id="pet" src="clawd-idle-follow.svg" alt="">
</div>
<script>
(function () {
  var pet = document.getElementById('pet');
  var bubble = document.getElementById('bubble');
  var bubbleText = document.getElementById('bubbleText');
  var curSvg = 'clawd-idle-follow.svg';

  window.setState = function (svg) {
    if (!svg || svg === curSvg) return;
    curSvg = svg;
    pet.src = svg;
  };

  /**
   * 设气泡文本。
   *
   * 【2026-10-10 修「DeepSeek 显示成 Deep」】用户看到的是被切断的词。
   * 两个问题叠加：
   *  1. 显示的是文本**开头**（旧内容），最新的内容看不到 ——
   *     气泡的用途是「它刚说了什么」，应该显示**尾部**
   *  2. 截断点落在词中间 —— 「DeepSeek」跨在边界上被切一半
   *
   * 修法：只保留尾部 MAX_CHARS 个字符；截断时**从词边界起切**
   *（向前找到最近的空白/标点，中文按字符切，英文词不拆）。
   * 前缀加「…」提示还有前文。
   */
  var BUBBLE_MAX_CHARS = 90;
  window.setBubble = function (text) {
    if (!text) {
      bubble.classList.remove('show');
      bubbleText.textContent = '';
      return;
    }
    var shown = text;
    if (shown.length > BUBBLE_MAX_CHARS) {
      shown = shown.slice(shown.length - BUBBLE_MAX_CHARS);
      // 词边界：向前找最近的空白/标点（限 12 字符内），避免把英文词切两半。
      // 中文没有空格，找不到就按字符切（中文单字独立，不算拆词）。
      var cut = -1;
      for (var i = 0; i < Math.min(12, shown.length); i++) {
        if (/[\s\u3000，。！？、；：,.!?;:)\]}】」』]/.test(shown.charAt(i))) {
          cut = i + 1;
          break;
        }
      }
      if (cut > 0) shown = shown.slice(cut);
      shown = '…' + shown;
    }
    bubbleText.textContent = shown;
    bubble.classList.add('show');
  };

  // 通知 Kotlin 侧页面就绪（避免 JS 注入早于页面加载完成）
  window.__ready = true;
})();
</script>
</body>
</html>
