name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept licenses & install packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        env:
          # versionCode 每次构建递增 —— 否则覆盖安装会被 Android 拒（"已存在更高版本"）
          CCM_VERSION_CODE: ${{ github.run_number }}
          CCM_VERSION_NAME: "0.1.${{ github.run_number }}"
        run: gradle assembleDebug --no-daemon --stacktrace

      # 校验签名确实是仓库里那把固定 key 签的。
      # 如果这步失败，说明 signingConfig 没生效（会退化成每次不同的 debug key），
      # 用户装的时候又会遇到「签名不一致」——所以宁可构建失败也别发出去。
      - name: Verify signing
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls $HOME/android-sdk/build-tools/*/apksigner | head -1)
          FP=$($BT verify --print-certs "$APK" 2>/dev/null | grep -i 'SHA-256 digest' | head -1)
          echo "签名指纹: $FP"
          echo "$FP" | grep -qi '6FC9F8FB543EFF18017CDD084FBE09DD5FC4F071D71768AD950068CE212FE659' \
            && echo "✅ 签名正确（固定 key）" \
            || { echo "❌ 签名不是固定 key！检查 signingConfigs"; exit 1; }

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccm-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 关键：同时发布到 Release，下载快得多（artifacts 走 S3 很慢）
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/CCM-${{ github.run_number }}.apk
          gh release create "$TAG" /tmp/CCM-${{ github.run_number }}.apk \
            --title "CCM build ${{ github.run_number }}" \
            --notes "自动构建 · commit ${{ github.sha }}" \
            || gh release upload "$TAG" /tmp/CCM-${{ github.run_number }}.apk --clobber
